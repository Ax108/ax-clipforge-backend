# Local Docker image for ClipForge API.
# Current target: run on the development machine only.
# Future: publish a tagged image and host it — see docs/DEPLOYMENT.md. Do not
# treat a public registry or Fly/Railway/Render as the present setup.
#
#   bun run docker:up
#
# Hosted frontends (Vercel / Netlify / Render) cannot reach this container
# on localhost. That needs a public API later.

# Host publish is loopback-only. The API process still listens on 0.0.0.0
# inside the container (LISTEN_HOST) so the mapped port works.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    mem_limit: 256m
    cpus: '0.5'
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    image: ax-clipforge-backend:local
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      PORT: '5000'
      LISTEN_HOST: '0.0.0.0'
      PUBLIC_API_URL: http://localhost:5000
      TMP_DIR: /tmp/clipforge
      KEEP_TMP: 'false'
      REDIS_URL: redis://redis:6379
      MAX_CLIP_SECONDS: '3600'
      MAX_SOURCE_SECONDS: '14400'
      MAX_ACTIVE_JOBS: '4'
      MIN_FREE_DISK_BYTES: '1073741824'
    mem_limit: 2g
    cpus: '2'
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:5000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      redis:
        condition: service_healthy
    # KEEP_TMP=false still *reuses* tmp/cache until TTL/size eviction.
    # Do not bind-mount ./tmp.
    # When YouTube asks the container to sign in, mount a gitignored Netscape
    # cookies.txt and set COOKIE_FILE_PATH=/app/cookies.txt. This Compose file
    # does not support an optional bind, so add the volume only after the file exists:
    #   - ./cookies.txt:/app/cookies.txt:ro
    # Future cloud stub (do not enable now):
    # image: ghcr.io/ax108/ax-clipforge-backend:TAG
    restart: unless-stopped
